<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ben 10 — Card Game</title>
<meta name="theme-color" content="#1a1626">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<canvas id="scene"></canvas>

<div id="setup-screen" class="overlay">
  <div class="panel">
    <h1>Ben 10 🃏</h1>
    <p class="tagline">Be first to make your hand total exactly 10. Play with real friends, anywhere.</p>

    <h2>Your name</h2>
    <input id="name-input" type="text" placeholder="Your name" maxlength="20" class="text-input" />

    <h2>Start a new game</h2>
    <button id="create-btn" class="primary-btn">Create game</button>

    <h2>Or join one</h2>
    <div class="join-row">
      <input id="code-input" type="text" placeholder="CODE" maxlength="4" class="text-input code-input" />
      <button id="join-btn" class="secondary-btn">Join</button>
    </div>

    <p id="setup-error" class="error-text"></p>
  </div>
</div>

<div id="waiting-screen" class="overlay hidden">
  <div class="panel">
    <h1>Waiting room</h1>
    <p class="tagline">Share this code with your friends:</p>
    <div class="room-code" id="room-code-display"></div>

    <h2>Players</h2>
    <div id="player-list" class="player-list"></div>

    <div id="host-controls" class="hidden">
      <h2>Difficulty</h2>
      <div class="choice-row" id="difficulty-choice">
        <button class="choice-btn selected" data-hand-size="4">Medium — 4 cards</button>
        <button class="choice-btn" data-hand-size="5">Hard — 5 cards</button>
      </div>
      <button id="add-bot-btn" class="secondary-btn">Add a bot</button>
      <button id="start-btn" class="primary-btn">Start game</button>
    </div>
    <p id="waiting-hint" class="tagline hidden">Waiting for the host to start the game…</p>
  </div>
</div>

<div id="labels"></div>

<div id="hud" class="hidden">
  <div id="turn-indicator"></div>
  <div id="log"></div>
  <div id="bottom-dock">
    <div class="hint"></div>
    <div id="action-panel"></div>
  </div>
</div>

<div id="win-screen" class="overlay hidden">
  <div class="panel">
    <h1 id="win-title">BEN TEN!</h1>
    <p id="win-subtitle"></p>
    <button id="restart-btn" class="primary-btn">Back to lobby</button>
  </div>
</div>

<script type="module" src="game.js"></script>
</body>
</html>
